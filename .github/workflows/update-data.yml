name: Update data and deploy

on:
  schedule:
    # 6時間ごと（UTC）。14:45 UTC は米経済指標発表(8:30 ET)後をカバー
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Save previous data for update detection and fallback
        # 公開中の data.json を確保（初回404は許容）。通知の差分比較と、
        # FF先物取得失敗時の前回値引き継ぎ（--prev）に使う
        run: curl -fsS https://takuma41n.github.io/us-econ-dashboard/data.json -o prev_data.json || true

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_data.py --out _site/data.json --prev prev_data.json

      - name: Assemble site
        run: cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify if indicators updated
        # 新しい観測値が出た指標があるときだけ ntfy.sh にプッシュ通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 notify_update.py --new _site/data.json --old prev_data.json
